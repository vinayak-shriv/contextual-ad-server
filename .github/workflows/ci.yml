name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The unit tests never speak HTTP, so handler-level input validation is
      # invisible to them -- which is how a NaN floor once reached a
      # NaN-to-integer conversion. This drives a real server over curl.
      - name: Smoke-test the HTTP layer
        run: bash scripts/smoke_test.sh
      - name: Benchmark (quick)
        run: ./build/adserve_bench --quick

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, "address,undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DADSERVE_SANITIZE=${{ matrix.sanitizer }} -DADSERVE_BUILD_SERVER=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/adserve_tests
